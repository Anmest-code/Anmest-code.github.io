<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ空间 专辑分享排版器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<!--
  ═══════════════════════════════════════════════════════════════
   QQ空间 专辑分享排版器（整活向 · 单文件 · 零依赖 · 离线可用）
   - 输入顶部文案 + 每张专辑的 风格/演奏者/专辑名称/发行年份
   - 自动生成花体字排版，一键复制去 QQ 空间粘贴
   - 默认字体方案与你平时的示例一致：
       风格/演奏者/年份 → 等宽体（𝙹𝚊𝚣𝚣 · 𝟷𝟿𝟿𝟾）
       专辑名称         → 双线体（𝕋𝕠𝕕𝕒𝕪）
       顶部文案         → 原文不转换
     每个位置都可以在「更多选项」里单独换字体
  ═══════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --bg:#0d1117;
    --card:#151b26;
    --line:#232c3d;
    --amber:#ffb020;
    --amber2:#ff8c00;
    --txt:#e8edf7;
    --dim:#8b94a8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:radial-gradient(1100px 700px at 50% -10%, #1b2336 0%, var(--bg) 55%);
    color:var(--txt);
    min-height:100vh;
  }
  .wrap{max-width:800px;margin:0 auto;padding:26px 16px 90px}
  h1{font-size:clamp(22px,5vw,28px);font-weight:900;letter-spacing:2px;margin-bottom:6px}
  h1 .hl{color:var(--amber);text-shadow:0 0 16px rgba(255,176,32,.4)}
  .sub{color:var(--dim);font-size:13px;line-height:1.8;margin-bottom:22px}

  .card{
    background:linear-gradient(180deg,rgba(21,26,38,.94),rgba(14,18,28,.94));
    border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;
  }
  .card h2{font-size:15px;color:var(--amber);letter-spacing:2px;font-weight:800;margin-bottom:16px}
  .card h2 .tag,.details-tag{font-size:11px;color:var(--dim);letter-spacing:1px;font-weight:400;margin-left:8px}
  details.card{padding:0;overflow:hidden}
  details.card > summary{
    cursor:pointer;list-style:none;padding:16px 20px;font-size:15px;font-weight:800;
    color:var(--amber);letter-spacing:2px;user-select:none;display:flex;align-items:center;gap:4px;
  }
  details.card > summary::-webkit-details-marker{display:none}
  details.card > summary::after{content:'▾';margin-left:auto;color:var(--dim);transition:transform .2s;font-size:13px}
  details.card[open] > summary::after{transform:rotate(180deg)}
  .detailbody{padding:0 20px 20px}

  label.lab{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  input[type=text],input[type=number],textarea,select{
    width:100%;background:#0d1119;border:1px solid var(--line);border-radius:9px;
    color:var(--txt);padding:10px 12px;font-size:14px;font-family:inherit;
    transition:border-color .15s;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--amber)}
  textarea{resize:vertical;line-height:1.7}
  #preview{min-height:230px;font-family:Consolas,"Courier New",monospace;font-size:13.5px;line-height:2;white-space:pre-wrap;word-break:break-all}

  .btn{
    appearance:none;border:none;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:800;letter-spacing:2px;color:#171300;
    background:linear-gradient(135deg,var(--amber),var(--amber2));
    padding:11px 24px;border-radius:10px;
    box-shadow:0 5px 0 #a35c00,0 10px 22px rgba(255,140,0,.22);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a35c00,0 5px 12px rgba(255,140,0,.18)}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{
    background:transparent;color:var(--txt);box-shadow:none;letter-spacing:1px;
    border:1px solid var(--line);font-size:13px;padding:9px 16px;
  }
  .btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
  .btn.mini{padding:8px 16px;font-size:13px;letter-spacing:1px;box-shadow:0 4px 0 #a35c00}
  .btn.mini:active{transform:translateY(2px)}

  .fontrow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:680px){.fontrow{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:420px){.fontrow{grid-template-columns:1fr}}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{
    font-size:12.5px;background:#0d1119;border:1px solid var(--line);border-radius:99px;
    padding:5px 13px;cursor:pointer;color:var(--txt);transition:border-color .15s,color .15s;
  }
  .chip:hover{border-color:var(--amber);color:var(--amber)}

  .countrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .countrow input{width:76px;text-align:center}
  .countrow .hint{font-size:12px;color:var(--dim)}

  .row{
    position:relative;border:1px solid var(--line);border-radius:12px;
    padding:16px 12px 12px;margin-bottom:14px;background:#121826;
  }
  .rowlabel{
    position:absolute;top:-9px;left:14px;background:var(--card);
    padding:0 10px;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;
  }
  .fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:640px){.fields{grid-template-columns:1fr 1fr}}
  @media(max-width:420px){.fields{grid-template-columns:1fr}}

  .btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  #stat{font-size:12px;color:var(--dim);margin-top:10px}
  .hint{font-size:12px;color:var(--dim);line-height:1.8;margin-top:10px}

  .foot{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#4b5468;pointer-events:none}
  #toast{
    position:fixed;left:50%;bottom:34px;z-index:60;
    transform:translateX(-50%) translateY(18px);
    background:#1e2636;border:1px solid var(--line);color:var(--txt);
    padding:10px 20px;border-radius:10px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 QQ空间 <span class="hl">专辑分享排版器</span></h1>
  <div class="sub">输入文案和专辑信息，自动生成花体字排版，一键复制去 QQ 空间粘贴。<br>纯本地工具：不联网、不传数据，断网也能用。</div>

  <!-- 顶部文案 -->
  <div class="card">
    <h2>① 顶部文案<span class="tag">就是最上面那一行，比如：Sun Ship</span></h2>
    <textarea id="in-top" rows="2" placeholder="例：Sun Ship"></textarea>
  </div>

  <!-- 专辑列表 -->
  <div class="card">
    <h2>② 专辑列表<span class="tag">填风格、演奏者、专辑名、发行年份</span></h2>
    <div class="countrow">
      <button class="btn mini" onclick="setCount(getCount()-1)">−</button>
      <input type="number" id="in-count" value="2" min="0" max="30">
      <button class="btn mini" onclick="setCount(getCount()+1)">＋</button>
      <span class="hint">张专辑</span>
      <span style="flex:1"></span>
      <button class="btn ghost" onclick="loadSample()">载入示例</button>
      <button class="btn ghost" onclick="clearAll()">清空</button>
    </div>
    <div id="rows"></div>
  </div>

  <!-- 更多选项（默认折叠） -->
  <details class="card" id="more-options">
    <summary>③ 更多选项<span class="details-tag">字体 / 分割线 / 空行等高级设置</span></summary>
    <div class="detailbody">
      <div class="presets">
        <button class="btn ghost" onclick="preset('mono','mono','dbl','mono')">预设 · 示例同款</button>
        <button class="btn ghost" onclick="preset('dbl','dbl','dbl','dbl')">预设 · 全部双线体</button>
        <button class="btn ghost" onclick="preset('bsans','bsans','bsans','bsans')">预设 · 全部粗体无衬线</button>
        <button class="btn ghost" onclick="preset('bold','bold','bold','bold')">预设 · 全部粗体</button>
      </div>
      <div class="fontrow">
        <div><label class="lab">顶部文案字体</label><select id="sel-top"></select></div>
        <div><label class="lab">风格字体</label><select id="sel-genre"></select></div>
        <div><label class="lab">演奏者字体</label><select id="sel-artist"></select></div>
        <div><label class="lab">专辑名称字体</label><select id="sel-album"></select></div>
        <div><label class="lab">年份字体</label><select id="sel-year"></select></div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:160px"><label class="lab">分隔线符号</label>
          <input type="text" id="in-sepchar" value="—" maxlength="4"></div>
        <div style="width:120px"><label class="lab">长度（几个符号）</label>
          <input type="number" id="in-seplen" value="20" min="1" max="80"></div>
        <div style="display:flex;align-items:flex-end;padding-bottom:6px">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);cursor:pointer">
            <input type="checkbox" id="in-blank" style="width:auto"> 条目之间空一行
          </label>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="hint">💡 提示：等宽体（𝙹𝚊𝚣𝚣）和双线体（𝕋𝕠𝕕𝕒𝕪）在 QQ 上显示最稳，也是你平时用的组合；哥特体、花体在部分手机上可能显示成 □。<br>💡 点击下方字体小标签，可快捷把「专辑名称」字体设为该样式。</div>
    </div>
  </details>

  <!-- 预览 -->
  <div class="card">
    <h2>④ 预览<span class="tag">点一下预览框可全选</span></h2>
    <textarea id="preview" readonly onclick="this.select()" placeholder="这里会实时显示生成结果…"></textarea>
    <div class="btnrow">
      <button class="btn" onclick="copyResult()">📋 一键复制</button>
      <span id="stat"></span>
    </div>
  </div>
</div>

<div id="toast"></div>
<div class="foot">纯本地排版工具 · 数据不出浏览器 · 与任何平台无关</div>

<script>
/* ══════════ 花体字定义（Unicode 数学字母数字符号） ══════════ */
function rangeCP(start, n) {
  var r = [];
  for (var i = 0; i < n; i++) r.push(start + i);
  return r;
}

var STYLE_DEFS = {
  bsans:   { name: '粗体无衬线', caps: rangeCP(0x1D5D4, 26), smalls: rangeCP(0x1D5EE, 26), digits: rangeCP(0x1D7EC, 10) },
  dbl:     { name: '双线体', caps: [0x1D538, 0x1D539, 0x2102, 0x1D53B, 0x1D53C, 0x1D53D, 0x1D53E, 0x210D, 0x1D540, 0x1D541, 0x1D542, 0x1D543, 0x1D544, 0x2115, 0x1D546, 0x2119, 0x211A, 0x211D, 0x1D54A, 0x1D54B, 0x1D54C, 0x1D54D, 0x1D54E, 0x1D54F, 0x1D550, 0x2124], smalls: rangeCP(0x1D552, 26), digits: rangeCP(0x1D7D8, 10) },
  bold:    { name: '粗体', caps: rangeCP(0x1D400, 26), smalls: rangeCP(0x1D41A, 26), digits: rangeCP(0x1D7CE, 10) },
  italic:  { name: '斜体', caps: rangeCP(0x1D434, 26), smalls: rangeCP(0x1D44E, 26), digits: null },
  bitalic: { name: '粗斜体', caps: rangeCP(0x1D468, 26), smalls: rangeCP(0x1D482, 26), digits: null },
  script:  { name: '花体', caps: [0x1D49C, 0x212C, 0x1D49E, 0x1D49F, 0x2130, 0x2131, 0x1D4A2, 0x210B, 0x2110, 0x1D4A5, 0x1D4A6, 0x2112, 0x2133, 0x1D4A9, 0x1D4AA, 0x1D4AB, 0x1D4AC, 0x211B, 0x1D4AD, 0x1D4AE, 0x1D4AF, 0x1D4B0, 0x1D4B1, 0x1D4B2, 0x1D4B3, 0x1D4B4], smalls: rangeCP(0x1D4B6, 26), digits: null },
  bscript: { name: '花体粗体', caps: rangeCP(0x1D4D0, 26), smalls: rangeCP(0x1D4EA, 26), digits: null },
  frak:    { name: '哥特体', caps: [0x1D504, 0x1D505, 0x212D, 0x1D507, 0x1D508, 0x1D509, 0x1D50A, 0x210C, 0x2111, 0x1D50D, 0x1D50E, 0x1D50F, 0x1D510, 0x1D511, 0x1D512, 0x1D513, 0x1D514, 0x211C, 0x1D516, 0x1D517, 0x1D518, 0x1D519, 0x1D51A, 0x1D51B, 0x1D51C, 0x2128], smalls: rangeCP(0x1D51E, 26), digits: null },
    bfrak:   { name: '哥特体粗体', caps: rangeCP(0x1D56C, 26), smalls: rangeCP(0x1D586, 26), digits: null },
  mono:    { name: '等宽', caps: rangeCP(0x1D670, 26), smalls: rangeCP(0x1D68A, 26), digits: rangeCP(0x1D7F6, 10) },
  sans:    { name: '无衬线', caps: rangeCP(0x1D5A0, 26), smalls: rangeCP(0x1D5BA, 26), digits: rangeCP(0x1D7E2, 10) },
  sansit:  { name: '无衬线斜体', caps: rangeCP(0x1D608, 26), smalls: rangeCP(0x1D622, 26), digits: null },
  full:    { name: '全角', caps: rangeCP(0xFF21, 26), smalls: rangeCP(0xFF41, 26), digits: rangeCP(0xFF10, 10) }
};

var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
var LOWERS  = 'abcdefghijklmnopqrstuvwxyz';
var DIGITS  = '0123456789';

function buildMap(def) {
  var m = {};
  var i;
  if (def.caps)   for (i = 0; i < 26; i++) m[LETTERS[i]] = String.fromCodePoint(def.caps[i]);
  if (def.smalls) for (i = 0; i < 26; i++) m[LOWERS[i]]  = String.fromCodePoint(def.smalls[i]);
  if (def.digits) for (i = 0; i < 10; i++) m[DIGITS[i]]  = String.fromCodePoint(def.digits[i]);
  return m;
}

var STYLES = {};
(function () {
  var k;
  for (k in STYLE_DEFS) STYLES[k] = buildMap(STYLE_DEFS[k]);
})();

function convert(text, key) {
  if (!key || key === 'plain' || !text) return text;
  var m = STYLES[key];
  var out = '';
  for (var ch of text) out += (m[ch] || ch);
  return out;
}

/* ══════════ 示例数据（就是你之前分享的那两条） ══════════ */
var SAMPLE = [
  ['Jazz Funk / World Music', 'Mulatu Astatke', 'Ethiopiques, Vol. 4: Ethio Jazz & Musique Instrumentale', '1998'],
  ['Jazz', 'McCoy Tyner', 'Today and Tomorrow', '1963']
];

/* ══════════ 初始化界面 ══════════ */
function fillSelects() {
  var opts = '<option value="plain">不转换（原文）</option>';
  var keys = Object.keys(STYLE_DEFS);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    opts += '<option value="' + k + '">' + STYLE_DEFS[k].name + '（' + convert('Aa 09', k) + '）</option>';
  }
  ['sel-top', 'sel-genre', 'sel-artist', 'sel-album', 'sel-year'].forEach(function (id) {
    document.getElementById(id).innerHTML = opts;
  });
  document.getElementById('sel-top').value = 'plain';
  document.getElementById('sel-genre').value = 'mono';
  document.getElementById('sel-artist').value = 'mono';
  document.getElementById('sel-album').value = 'dbl';
  document.getElementById('sel-year').value = 'mono';
}

function buildChips() {
  var host = document.getElementById('chips');
  host.innerHTML = '';
  var keys = Object.keys(STYLE_DEFS);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var s = document.createElement('span');
    s.className = 'chip';
    s.title = '点击：把「专辑名称」字体设为「' + STYLE_DEFS[k].name + '」';
    s.textContent = STYLE_DEFS[k].name + '  ' + convert('Aa 09', k);
    (function (key) {
      s.addEventListener('click', function () {
        document.getElementById('sel-album').value = key;
        update();
      });
    })(k);
    host.appendChild(s);
  }
}

function addRow(data) {
  var row = document.createElement('div');
  row.className = 'row';
  row.innerHTML =
    '<span class="rowlabel">专辑</span>' +
    '<div class="fields">' +
    '<div><label class="lab">风格</label><input class="f g" placeholder="例：Jazz Funk"></div>' +
    '<div><label class="lab">演奏者</label><input class="f a" placeholder="例：Mulatu Astatke"></div>' +
    '<div><label class="lab">专辑名称</label><input class="f al" placeholder="例：Ethiopiques, Vol. 4"></div>' +
    '<div><label class="lab">发行年份</label><input class="f y" placeholder="例：1998"></div>' +
    '</div>';
  if (data) {
    row.querySelector('.g').value = data[0] || '';
    row.querySelector('.a').value = data[1] || '';
    row.querySelector('.al').value = data[2] || '';
    row.querySelector('.y').value = data[3] || '';
  }
  var ins = row.querySelectorAll('input');
  for (var i = 0; i < ins.length; i++) ins[i].addEventListener('input', update);
  return row;
}

function renumber() {
  var rows = document.querySelectorAll('#rows .row');
  for (var i = 0; i < rows.length; i++) {
    rows[i].querySelector('.rowlabel').textContent = '专辑 ' + (i + 1);
  }
}

function getCount() {
  return parseInt(document.getElementById('in-count').value, 10) || 0;
}

function setCount(n) {
  n = Math.max(0, Math.min(30, n));
  var wrap = document.getElementById('rows');
  while (wrap.children.length < n) wrap.appendChild(addRow(null));
  while (wrap.children.length > n) wrap.removeChild(wrap.lastChild);
  document.getElementById('in-count').value = n;
  renumber();
  update();
}

function loadSample() {
  document.getElementById('in-top').value = 'Sun Ship';
  var wrap = document.getElementById('rows');
  wrap.innerHTML = '';
  for (var i = 0; i < SAMPLE.length; i++) wrap.appendChild(addRow(SAMPLE[i]));
  document.getElementById('in-count').value = SAMPLE.length;
  renumber();
  update();
}

function clearAll() {
  document.getElementById('in-top').value = '';
  var wrap = document.getElementById('rows');
  wrap.innerHTML = '';
  document.getElementById('in-count').value = 0;
  update();
}

function preset(g, a, al, y) {
  document.getElementById('sel-genre').value = g;
  document.getElementById('sel-artist').value = a;
  document.getElementById('sel-album').value = al;
  document.getElementById('sel-year').value = y;
  update();
}

/* ══════════ 实时生成 ══════════ */
function update() {
  var top = document.getElementById('in-top').value;
  var topFont = document.getElementById('sel-top').value;
  var sepChar = document.getElementById('in-sepchar').value || '—';
  var sepLen = parseInt(document.getElementById('in-seplen').value, 10) || 20;
  sepLen = Math.max(1, Math.min(80, sepLen));
  var sep = sepChar.repeat(sepLen);
  var blank = document.getElementById('in-blank').checked;

  var fonts = [
    document.getElementById('sel-genre').value,
    document.getElementById('sel-artist').value,
    document.getElementById('sel-album').value,
    document.getElementById('sel-year').value
  ];

  var blocks = [];
  if (top.trim()) blocks.push(convert(top, topFont));

  var rows = document.querySelectorAll('#rows .row');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var vals = [
      row.querySelector('.g').value.trim(),
      row.querySelector('.a').value.trim(),
      row.querySelector('.al').value.trim(),
      row.querySelector('.y').value.trim()
    ];
    var empty = true;
    for (var j = 0; j < 4; j++) if (vals[j]) { empty = false; break; }
    if (empty) continue;
    var parts = [];
    for (j = 0; j < 4; j++) {
      var v = convert(vals[j], fonts[j]);
      if (v) parts.push(v);
    }
    if (parts.length) blocks.push(parts.join(' - '));
  }

  var out = [];
  for (var b = 0; b < blocks.length; b++) {
    out.push(blocks[b]);
    if (b < blocks.length - 1) {
      if (blank) out.push('');
      out.push(sep);
    }
  }
  var text = out.join('\n');
  document.getElementById('preview').value = text;
  document.getElementById('stat').textContent = '共 ' + blocks.length + ' 块 · ' + text.length + ' 字符 · 预览实时更新中';
}

/* ══════════ 复制 ══════════ */
function copyResult() {
  var pre = document.getElementById('preview');
  var text = pre.value;
  if (!text) { toast('还没有内容，先填点东西吧'); return; }
  var done = function () { toast('已复制！去 QQ 空间粘贴吧 ✨'); };
  function fallback() {
    pre.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动长按复制'); }
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
}
